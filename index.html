<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lâmpada com Toggle</title>
    <style>
        /* RESET E FUNDO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(ellipse at 50% 50%, #0a1a3a, #040812);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 16px;
            background-image: 
                linear-gradient(rgba(0, 100, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 100, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* CONTAINER */
        .toggle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 32px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            width: 96%;
            max-width: 400px;
            position: relative;
        }

        /* ======================== */
        /* SEU NOME - ERICK CRIADOR DE SITES */
        /* ======================== */
        .brand {
            font-size: 12px;
            color: rgba(147, 197, 253, 0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
            border-top: 1px solid rgba(59, 130, 246, 0.1);
            padding-top: 15px;
            margin-top: 5px;
            width: 100%;
            text-align: center;
            transition: color 0.4s ease;
        }

        .brand.on {
            color: rgba(251, 191, 36, 0.6);
        }

        .toggle-container h2 {
            color: #93c5fd;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0.6;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
            margin-bottom: 5px;
        }

        /* ======================== */
        /* LÂMPADA */
        /* ======================== */
        .lamp {
            font-size: 80px;
            line-height: 1;
            margin: 10px 0;
            transition: all 0.4s ease;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.05));
            user-select: none;
        }

        .lamp.on {
            filter: drop-shadow(0 0 40px rgba(255, 200, 50, 0.8));
            animation: brilho 1.2s ease-in-out infinite alternate;
        }

        @keyframes brilho {
            0% { filter: drop-shadow(0 0 30px rgba(255, 200, 50, 0.5)); }
            100% { filter: drop-shadow(0 0 70px rgba(255, 200, 50, 1)); }
        }

        /* ======================== */
        /* TOGGLE */
        /* ======================== */
        .toggle {
            position: relative;
            width: 90px;
            height: 48px;
            cursor: pointer;
            margin: 5px 0;
            flex-shrink: 0;
        }

        .toggle input {
            width: 0;
            height: 0;
            visibility: hidden;
            position: absolute;
        }

        .toggle label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #242424;
            border-radius: 60px;
            transition: background 0.4s ease;
            cursor: pointer;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle label::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 38px;
            height: 38px;
            background: linear-gradient(180deg, #888, #3a3a3a);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* LIGADO - Fundo amarelo */
        .toggle input:checked + label {
            background: #fbbf24;
            box-shadow: 
                0 0 30px rgba(251, 191, 36, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .toggle input:checked + label::after {
            left: 46px;
            transform: translateX(0);
            background: linear-gradient(180deg, #ffffff, #fde68a);
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
        }

        /* EFEITO DE CLIQUE */
        .toggle input:active + label::after {
            width: 44px;
        }
        .toggle input:checked:active + label::after {
            width: 44px;
        }

        /* ============================================ */
        /* RESPONSIVO */
        /* ============================================ */
        @media (max-width: 480px) {
            .toggle-container {
                padding: 30px 20px;
                gap: 20px;
                border-radius: 28px;
                width: 98%;
            }

            .toggle-container h2 {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .lamp {
                font-size: 60px;
            }

            .toggle {
                width: 76px;
                height: 40px;
            }

            .toggle label::after {
                width: 30px;
                height: 30px;
                top: 4px;
                left: 4px;
            }

            .toggle input:checked + label::after {
                left: 40px;
            }

            .toggle input:active + label::after {
                width: 36px;
            }
            .toggle input:checked:active + label::after {
                width: 36px;
            }

            .brand {
                font-size: 10px;
                letter-spacing: 2px;
                padding-top: 12px;
            }
        }

        @media (max-width: 360px) {
            .toggle-container {
                padding: 20px 16px;
                gap: 15px;
                border-radius: 24px;
            }

            .toggle-container h2 {
                font-size: 10px;
                letter-spacing: 2px;
            }

            .lamp {
                font-size: 50px;
            }

            .toggle {
                width: 64px;
                height: 34px;
            }

            .toggle label::after {
                width: 24px;
                height: 24px;
                top: 3px;
                left: 3px;
            }

            .toggle input:checked + label::after {
                left: 35px;
            }

            .toggle input:active + label::after {
                width: 30px;
            }
            .toggle input:checked:active + label::after {
                width: 30px;
            }

            .brand {
                font-size: 9px;
                letter-spacing: 1px;
                padding-top: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="toggle-container">
        <h2>💡 LÂMPADA</h2>
        
        <!-- LÂMPADA -->
        <div class="lamp" id="lamp">💡</div>
        
        <!-- TOGGLE -->
        <div class="toggle">
            <input type="checkbox" id="toggleBtn">
            <label for="toggleBtn"></label>
        </div>

        <!-- SEU NOME -->
        <div class="brand" id="brand">Erick Criador de Sites</div>
    </div>

    <script>
        const checkbox = document.getElementById('toggleBtn');
        const lamp = document.getElementById('lamp');
        const brand = document.getElementById('brand');

        checkbox.addEventListener('change', function() {
            if (this.checked) {
                lamp.textContent = '💡';
                lamp.classList.add('on');
                brand.classList.add('on');
            } else {
                lamp.textContent = '💡';
                lamp.classList.remove('on');
                brand.classList.remove('on');
            }
        });
    </script>

</body>
</html>
