<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital - Fundo Azul Escuro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* RESET E FUNDO AZUL ESCURO (GRADIENTE) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* Fundo azul escuro profundo com leve degradê */
            background: radial-gradient(ellipse at 50% 50%, #0a1a3a, #040812);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', monospace;
            padding: 20px;
            /* Grade sutil de fundo para dar textura (opcional, mas fica lindo) */
            background-image: 
                linear-gradient(rgba(0, 100, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 100, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* CARTÃO COM EFEITO GLASS (transparente, com borda azul) */
        .clock-container {
            background: rgba(6, 14, 36, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 50px 70px;
            border: 1px solid rgba(59, 130, 246, 0.25);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(0, 80, 255, 0.05);
            text-align: center;
            position: relative;
        }

        /* Pequena linha decorativa no topo */
        .clock-label {
            font-size: 11px;
            color: #60a5fa;
            letter-spacing: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 400;
            opacity: 0.5;
        }

        /* HORAS, MINUTOS, SEGUNDOS - TODOS BRANCOS E NÍTIDOS */
        .time {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 0; /* Remove espaços extras */
        }

        .time span {
            font-size: 130px;
            line-height: 1;
            letter-spacing: 5px;
            /* BRANCO PURO para máxima legibilidade */
            color: #ffffff;
            /* Sombra azul suave (pouco blur para não borrar) */
            text-shadow: 0 0 12px rgba(0, 100, 255, 0.3);
        }

        /* DOIS PONTOS (:) PISCANDO - BRANCOS TAMBÉM */
        .blink {
            font-size: 130px;
            line-height: 1;
            color: #93c5fd;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            animation: piscar 0.8s step-end infinite;
            font-weight: 900;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }

        /* DIA DA SEMANA E DATA - AZUL CLARO (fácil de ler) */
        .date {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 700;
            color: #93c5fd;
            letter-spacing: 6px;
            text-transform: uppercase;
            border-top: 2px solid rgba(59, 130, 246, 0.15);
            padding-top: 20px;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 10px rgba(0, 50, 255, 0.1);
        }

        /* VERSÃO RESPONSIVA PARA CELULAR (VISUALIZAÇÃO DO SHORTS) */
        @media (max-width: 600px) {
            .clock-container {
                padding: 30px 20px;
                border-radius: 32px;
                width: 95%;
                max-width: 380px;
            }
            .time span {
                font-size: 68px;
                letter-spacing: 2px;
            }
            .blink {
                font-size: 68px;
            }
            .date {
                font-size: 13px;
                letter-spacing: 4px;
                margin-top: 15px;
                padding-top: 15px;
            }
            .clock-label {
                font-size: 9px;
                letter-spacing: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="clock-label">⏱️ DIGITAL</div>
        <div class="time" id="clockDisplay">
            <span id="hours">00</span>
            <span class="blink">:</span>
            <span id="minutes">00</span>
            <span class="blink">:</span>
            <span id="seconds">00</span>
        </div>
        <div class="date" id="dateDisplay">SEGUNDA-FEIRA, 01/01/2026</div>
    </div>

    <script>
        // Função principal que atualiza o relógio
        function updateClock() {
            const now = new Date();

            // --- PEGANDO HORAS, MINUTOS E SEGUNDOS ---
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let seconds = now.getSeconds().toString().padStart(2, '0');

            // --- ATUALIZANDO O HTML ---
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;

            // --- PEGANDO DIA DA SEMANA E DATA (FORMATO BRASIL) ---
            const daysOfWeek = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
            const dayName = daysOfWeek[now.getDay()];
            const day = now.getDate().toString().padStart(2, '0');
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const year = now.getFullYear();

            document.getElementById('dateDisplay').textContent = `${dayName}, ${day}/${month}/${year}`;
        }

        // Atualiza a cada 1 segundo
        setInterval(updateClock, 1000);

        // Chama imediatamente para não aparecer "00:00:00"
        updateClock();
    </script>

</body>
</html>
