<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toggle Moderno - Celular</title>
    <style>
        /* RESET E FUNDO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh; /* Para celular (dynamic viewport height) */
            background: radial-gradient(ellipse at 50% 50%, #0a1a3a, #040812);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            background-image: 
                linear-gradient(rgba(0, 100, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 100, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* CONTAINER - OCUPA QUASE TODA A TELA */
        .toggle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            width: 92%;
            max-width: 380px;
        }

        .toggle-container h2 {
            color: #93c5fd;
            font-size: 18px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0.6;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        /* ======================== */
        /* TOGGLE GRANDE (FÁCIL DE VER) */
        /* ======================== */
        .toggle {
            position: relative;
            width: 110px;
            height: 56px;
            cursor: pointer;
            margin: 10px 0;
        }

        /* ESCONDE O CHECKBOX */
        .toggle input {
            width: 0;
            height: 0;
            visibility: hidden;
            position: absolute;
        }

        /* LABEL = BOTÃO VISÍVEL */
        .toggle label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #242424;
            border-radius: 60px;
            transition: background 0.4s ease;
            cursor: pointer;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* BOLINHA GRANDE */
        .toggle label::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 44px;
            height: 44px;
            background: linear-gradient(180deg, #888, #3a3a3a);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ESTADO ATIVADO (CHECKED) - FUNDO AZUL NEON */
        .toggle input:checked + label {
            background: #1a4cff;
            box-shadow: 
                0 0 30px rgba(26, 76, 255, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* BOLINHA DESLIZA PARA DIREITA */
        .toggle input:checked + label::after {
            left: 59px;
            transform: translateX(0);
            background: linear-gradient(180deg, #ffffff, #a0c0ff);
            box-shadow: 0 4px 20px rgba(26, 76, 255, 0.3);
        }

        /* EFEITO DE CLIQUE (ACTIVE) - BOLINHA CRESCE */
        .toggle input:active + label::after {
            width: 52px;
            background: linear-gradient(180deg, #999, #555);
        }

        .toggle input:checked:active + label::after {
            width: 52px;
            background: linear-gradient(180deg, #8ab4ff, #3a7aff);
        }

        /* STATUS (LIGADO/DESLIGADO) - GRANDE E NÍTIDO */
        .status {
            color: #64748b;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            transition: color 0.4s ease;
            margin-top: 5px;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .toggle input:checked ~ .status {
            color: #60a5fa;
            text-shadow: 0 0 30px rgba(26, 76, 255, 0.2);
        }

        /* ÍCONE DE LUZ (DECORATIVO) */
        .icon {
            font-size: 28px;
            margin-bottom: 5px;
            opacity: 0.4;
            transition: opacity 0.4s ease;
        }

        .toggle input:checked ~ .icon {
            opacity: 1;
        }

        /* RESPONSIVO PARA TELAS MENORES */
        @media (max-width: 480px) {
            .toggle-container {
                padding: 40px 25px;
                gap: 20px;
                border-radius: 32px;
            }

            .toggle-container h2 {
                font-size: 14px;
                letter-spacing: 4px;
            }

            .toggle {
                width: 90px;
                height: 46px;
            }

            .toggle label::after {
                width: 36px;
                height: 36px;
                top: 4px;
                left: 4px;
            }

            .toggle input:checked + label::after {
                left: 48px;
            }

            .toggle input:active + label::after {
                width: 42px;
            }
            .toggle input:checked:active + label::after {
                width: 42px;
            }

            .status {
                font-size: 16px;
                letter-spacing: 3px;
            }

            .icon {
                font-size: 22px;
            }
        }

        /* PARA TELAS MUITO PEQUENAS (ex: 360px) */
        @media (max-width: 380px) {
            .toggle {
                width: 76px;
                height: 40px;
            }

            .toggle label::after {
                width: 30px;
                height: 30px;
                top: 4px;
                left: 4px;
            }

            .toggle input:checked + label::after {
                left: 40px;
            }

            .toggle input:active + label::after {
                width: 36px;
            }
            .toggle input:checked:active + label::after {
                width: 36px;
            }

            .status {
                font-size: 14px;
            }

            .toggle-container h2 {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="toggle-container">
        <div class="icon">💡</div>
        <h2>⚡ TOGGLE</h2>
        
        <div class="toggle">
            <input type="checkbox" id="toggleBtn">
            <label for="toggleBtn"></label>
            <span class="status">● DESLIGADO</span>
        </div>
    </div>

    <script>
        const checkbox = document.getElementById('toggleBtn');
        const statusText = document.querySelector('.status');
        const icon = document.querySelector('.icon');

        checkbox.addEventListener('change', function() {
            if (this.checked) {
                statusText.textContent = '● LIGADO';
                statusText.style.color = '#60a5fa';
                icon.textContent = '⚡';
            } else {
                statusText.textContent = '● DESLIGADO';
                statusText.style.color = '#64748b';
                icon.textContent = '💡';
            }
        });
    </script>

</body>
</html>
